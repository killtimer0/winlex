name: Build distribution artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - name: Prepare pinned test metadata
        shell: pwsh
        run: |
          uv run --locked python tests/metadata/prepare_source.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check formatting and host libraries
        shell: pwsh
        run: |
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup component add rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p winlex-core -p winlex-format -p winlex-cli --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  dist:
    needs: checks
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target and license documentation
        shell: pwsh
        run: |
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $policy = (Get-Content inputs/targets.json -Raw | ConvertFrom-Json).'${{ matrix.arch }}'
          rustup target add $policy.target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup component add rust-docs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - name: Prepare pinned compatibility dependencies
        shell: pwsh
        run: |
          uv run --locked python scripts/prepare-inputs.py --architecture ${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install ARM64 MSVC tools if needed
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $policy = (Get-Content inputs/targets.json -Raw | ConvertFrom-Json).'${{ matrix.arch }}'
          $vs = & $vswhere -latest -products * -requires $policy.vs_component -property installationPath
          if (-not $vs) {
            $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $vs) { throw 'Visual Studio C++ tools not found.' }
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
            $process = Start-Process -FilePath $installer -ArgumentList @('modify', '--installPath', "`"$vs`"", '--add', $policy.vs_component, '--quiet', '--norestart') -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) { throw "MSVC ARM64 installation failed: $($process.ExitCode)" }
          }
      - name: Validate Debug build and contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = '${{ matrix.arch }}'
          ./scripts/build.ps1 -Architecture $arch -TargetDir "$pwd/target"
          $policy = (Get-Content inputs/targets.json -Raw | ConvertFrom-Json).$arch
          $env:WINLEX_TEST_ARCH = $arch
          $env:WINLEX_PACKAGE_REQUIRE_ARCH = $arch
          [Environment]::SetEnvironmentVariable("WINLEX_PACKAGE_$($arch.ToUpperInvariant())_BUILD_DIR", "$pwd/target/$($policy.target)/debug", 'Process')
          uv run --locked --group tests python -m unittest discover -s tests/scripts -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = '${{ matrix.arch }}'
          ./scripts/build.ps1 -Architecture $arch -Configuration Dist -TargetDir "$pwd/target"
          $policy = (Get-Content inputs/targets.json -Raw | ConvertFrom-Json).$arch
          $bin = "$pwd/target/$($policy.target)/dist"
          ./scripts/package.ps1 -Architecture $arch -CliBuildRecord "$bin/winlex.exe.build.json" -GuiBuildRecord "$bin/winlex-gui.exe.build.json" -OutputDir "$pwd/artifacts"
      - uses: actions/upload-artifact@v4
        with:
          name: winlex-${{ matrix.arch }}
          path: |
            artifacts/winlex-${{ matrix.arch }}.zip
            artifacts/winlex-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
