[package]
name = "winlex"
version = "0.1.0"
edition = "2024"
license.workspace = true
build = "build.rs"
default-run = "winlex"

[profile.dist]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "winlex-gui"
path = "src/gui.rs"

[workspace]
members = ["crates/winlex-core", "crates/winlex-format", "crates/winlex-cli", "crates/winlex-gui"]
default-members = ["."]
exclude = ["vendor/windows-metadata"]
resolver = "3"

[dependencies]
winlex-cli = { path = "crates/winlex-cli" }
winlex-gui = { path = "crates/winlex-gui" }

[build-dependencies]
serde_json.workspace = true

[workspace.package]
license = "GPL-3.0-only"

[workspace.dependencies]
windows-metadata = "=0.100.0"
repc = "=0.1.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
anyhow = "1"

[patch.crates-io]
windows-metadata = { path = "vendor/windows-metadata" }
