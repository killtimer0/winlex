[package]
name = "winlex-core"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
serde.workspace = true
windows-metadata.workspace = true
repc.workspace = true
sha1.workspace = true
anyhow.workspace = true
nucleo-matcher = { version = "0.3.1", default-features = false, features = ["unicode-casefold", "unicode-normalization"] }
winnow = { version = "1.0.4", default-features = false, features = ["std", "ascii"] }
cpp_demangle.workspace = true
msvc-demangler.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Environment", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemInformation"] }
