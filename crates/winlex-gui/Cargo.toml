[package]
name = "winlex-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
windows = { version = "=0.58.0", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Controls_RichEdit", "Win32_Graphics_Gdi"] }
winlex-core = { path = "../winlex-core" }
winlex-format = { path = "../winlex-format" }
windows-sys = { version = "=0.59.0", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_UI_Shell_Common",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_WindowsProgramming",
    "Win32_System_SystemInformation",
    "Win32_UI_Controls",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
