[project]
name = "winlex-development"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["py7zr>=1.1.4"]

[dependency-groups]
tests = ["PyYAML>=6.0"]
gui = [
    "pytest==8.3.5",
    "pywin32>=310; sys_platform == 'win32'",
    "uiautomation==2.0.29; sys_platform == 'win32'",
    "comtypes==1.4.12; sys_platform == 'win32'",
]
media = [
    "uiautomation==2.0.29; sys_platform == 'win32'",
    "comtypes==1.4.12; sys_platform == 'win32'",
    "Pillow>=10",
    "pywin32>=310; sys_platform == 'win32'",
]

[tool.uv]
package = false
